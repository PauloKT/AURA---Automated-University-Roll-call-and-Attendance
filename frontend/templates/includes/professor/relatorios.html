<section data-panel="relatorios" hidden>
  <header class="page-heading">
    <div>
      <h1>Relatórios de frequência</h1>
      <p>Identifique quem precisa de atenção e acompanhe cada turma.</p>
    </div>
    <button class="button secondary" id="export-report">{% include 'includes/icon.html' with name='download' %}Exportar CSV</button>
  </header>
  <div class="panel">
    <div class="filters">
      <div class="field">
        <label for="report-group">Turma</label>
        <select id="report-group" name="report-group" autocomplete="off">
          <option value="">Todas as turmas</option>
        </select>
      </div>
      <div class="field">
        <label for="report-student">Aluno</label>
        <input id="report-student" type="search" placeholder="Nome do aluno" name="report-student" autocomplete="off">
      </div>
      <div class="field">
        <label for="report-status">Situação</label>
        <select id="report-status" name="report-status" autocomplete="off">
          <option value="">Todas</option>
          <option value="reprovado">Atenção</option>
          <option value="aprovado">Regular</option>
          <option value="sem_dados">Sem chamadas</option>
        </select>
      </div>
    </div>
    <p class="muted">O percentual considera apenas chamadas encerradas. Chamadas em andamento não alteram a frequência.</p>
    <div id="report-table"></div>
  </div>
</section>
